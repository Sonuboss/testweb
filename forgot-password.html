<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MYTEST1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <form id="forgotForm" class="login-card">
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your registered email address to receive a password reset link.</p>
            
            <div class="form-group">
                <label for="resetEmail">Email Address</label>
                <input type="email" id="resetEmail" name="resetEmail" placeholder="Enter your email" required autocomplete="email">
            </div>

            <button type="submit" class="submit-btn">Send Reset Link</button>

            <div class="back-to-login">
                <a href="index.html" class="forgot-link">← Back to Login</a>
            </div>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
